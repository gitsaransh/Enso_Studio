name: Deploy Enso Studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'enso-v2/**'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Next.js
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: enso-v2/package-lock.json

      - name: Install dependencies
        working-directory: enso-v2
        run: npm ci

      - name: Build Next.js (static export)
        working-directory: enso-v2
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: enso-v2/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
